<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Öznur ❤️</title>
    <style>
        /* --- Variablen & Setup --- */
        :root {
            --bg-gradient-start: #fff0f5; 
            --bg-gradient-end: #f8c3d3;   
            --envelope-color: #ff8fa3;
            --envelope-shadow-color: #e77a8c;
            --letter-paper: #fffbfb;
            --text-color: #c2185b;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; 
            background: radial-gradient(circle at center, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden; 
        }

        /* --- Der Briefumschlag-Container --- */
        .envelope-container {
            position: relative;
            cursor: pointer;
            animation: float 3s ease-in-out infinite;
        }
        
        .envelope-container.open {
            animation: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(0.9); }
            50% { transform: translateY(-10px) scale(0.9); }
        }

        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
