<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Öznur ❤️</title>
    <style>
        /* --- Variablen & Setup --- */
        :root {
            --bg-gradient-start: #fff0f5; 
            --bg-gradient-end: #f8c3d3;   
            --envelope-color: #ff8fa3;
            --envelope-shadow-color: #e77a8c;
            --letter-paper: #fffbfb;
            --text-color: #c2185b;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; 
            background: radial-gradient(circle at center, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden; 
        }

        /* --- BLUMEN AM RAND (NEU) --- */
        .side-flowers {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 25px; /* Abstand zwischen den Blumen */
            font-size: 24px;
            z-index: 0; /* Ganz hinten, damit sie nicht den Brief stören */
            pointer-events: none; /* Klicks gehen durch */
            opacity: 0.8;
            animation: float-flowers 4s ease-in-out infinite;
        }

        .side-flowers.left { left: 15px; animation-delay: 0s; }
        .side-flowers.right { right: 15px; animation-delay: 2s; }

        @keyframes float-flowers {
            0%, 100% { transform: translateY(-50%) translateY(0px); }
            50% { transform: translateY(-50%) translateY(-10px); }
        }

        /* Media Query für kleine Handys: Blumen kleiner und dichter am Rand */
        @media (max-width: 400px) {
            .side-flowers {
                font-size: 18px;
                gap: 15px;
            }
            .side-flowers.left { left: 5px; }
            .side-flowers.right { right: 5px; }
        }


        /* --- Der Briefumschlag-Container --- */
        .envelope-container {
            position: relative;
            cursor: pointer;
            animation: float 3s ease-in-out infinite;
            z-index: 2; /* Liegt über den Blumen */
        }
        
        .envelope-container.open {
            animation: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(0.9); }
            50% { transform: translateY(-10px) scale(0.9); }
        }

        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: var(--envelope-shadow-color);
            box-shadow: 0 15px 35px rgba(194, 24, 91, 0.2);
            border-radius: 5px;
            z-index: 1;
        }

        /* --- Die Dreiecke des Umschlags --- */
        .envelope-front {
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 100px solid var(--envelope-color);
            z-index: 10; 
            border-radius: 0 0 5px 5px;
        }

        .envelope-sides {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-left: 150px solid var(--envelope-color);
            z-index: 10;
            border-radius: 5px 0 0 5px;
        }
        .envelope-sides.right {
            left: auto; right: 0;
            border-left: none;
            border-right: 150px solid var(--envelope-color);
            border-radius: 0 5px 5px 0;
        }

        .envelope-lid {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid var(--envelope-color);
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.6s ease;
            z-index: 11; 
            border-radius: 5px 5px 0 0;
        }

        .seal {
            position: absolute;
            top: 85px; left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            z-index: 12;
            transition: all 0.4s ease;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }

        /* --- Das Briefpapier --- */
        .letter {
            position: absolute;
            top: 5px; 
            left: 10px;
            width: 280px; 
            height: 190px; 
            background-color: var(--letter-paper);
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 4px;
            z-index: 5; 
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .kitty-gif {
            width: 90px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .letter h1 {
            margin: 0 0 5px 0; 
            font-size: 20px;
            font-weight: normal;
            color: #d32f2f;
        }
        .letter p {
            font-size: 16px;
            line-height: 1.4;
            margin: 0;
        }

        /* --- Animationszustände --- */
        .envelope-container.open .envelope-lid {
            transform: rotateX(180deg);
            border-top-color: var(--envelope-shadow-color);
        }

        .envelope-container.open .letter {
            transform: translateY(-210px) rotate(-2deg);
            z-index: 20; 
        }
        
        .envelope-container.open .seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.5);
        }

        .hint {
            position: absolute;
            bottom: 30px;
            color: var(--text-color);
            font-size: 14px;
            opacity: 0.6;
            letter-spacing: 1px;
            animation: pulsate 2s infinite;
            pointer-events: none; 
            z-index: 20;
        }
        @keyframes pulsate {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }

        /* --- VERSION TAG --- */
        .version-tag {
            position: fixed;
            bottom: 5px; right: 5px;
            font-family: monospace; font-size: 10px;
            color: #000; opacity: 0.3; pointer-events: none;
            z-index: 100;
        }

        /* --- KONFETTI CSS --- */
        .confetti {
            position: absolute; width: 10px; height: 10px;
            top: -10px; z-index: 99; pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(720deg); }
        }

    </style>
</head>
<body>

    <div class="side-flowers left">
        <div>🌸</div>
        <div>🌹</div>
        <div>🌺</div>
        <div>🌷</div>
        <div>🌻</div>
        <div>💐</div>
    </div>

    <div class="side-flowers right">
        <div>💐</div>
        <div>🌻</div>
        <div>🌷</div>
        <div>🌺</div>
        <div>🌹</div>
        <div>🌸</div>
    </div>

    <div class="envelope-container" id="envelope" onclick="openLetter()">
        <div class="envelope-wrapper">
            <div class="envelope-lid"></div>
            <div class="envelope-front"></div>
            <div class="envelope-sides"></div>
            <div class="envelope-sides right"></div>
            <div class="seal">❤️</div>
            
            <div class="letter">
                <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExdDRkZm8ybm9iNTF1Yjl3Yzl2bHE4ajVwdzZ0NXdxZWg2eHVyNGVlcSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/kZqbBT64ECtjy/giphy.gif" alt="Hello Kitty Love" class="kitty-gif">
                
                <h1>Meine liebe Öznur,</h1>
                <p>Ich liebe dich vom ganzen Herzen! ❤️<br>Dein Cem</p>
            </div>
        </div>
    </div>
    
    <div class="hint" id="hint-text">Tippe, um mein Herz zu öffnen</div>
    
    <div class="version-tag">v1.2</div>

    <script>
        let isOpen = false;

        function openLetter() {
            if (isOpen) return; 
            isOpen = true;

            const container = document.getElementById('envelope');
            const hint = document.getElementById('hint-text');
            
            container.classList.add('open');
            hint.style.display = 'none';

            launchConfetti();
        }

        function launchConfetti() {
            const colors = ['#ffcdd2', '#f8bbd0', '#e1bee7', '#ff8fa3', '#ffeb3b', '❤️', '🎀', '🌸'];
            const confettiCount = 60; 

            for (let i = 0; i < confettiCount; i++) {
                createParticle(colors);
            }
        }

        function createParticle(colors) {
            const particle = document.createElement('div');
            const randomChoice = colors[Math.floor(Math.random() * colors.length)];
            
            if (['❤️', '🎀', '🌸'].includes(randomChoice)) {
                particle.innerText = randomChoice;
                particle.style.fontSize = (Math.random() * 15 + 10) + 'px';
            } else {
                particle.style.backgroundColor = randomChoice;
                particle.style.width = (Math.random() * 10 + 5) + 'px';
                particle.style.height = (Math.random() * 10 + 5) + 'px';
                particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            }

            particle.classList.add('confetti');
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 2 + 's';
            particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
            
            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 6000);
        }
    </script>

</body>
</html>
