<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entschuldigung an Öznur</title>
    <style>
        /* --- Neue Variablen für den ernsteren Look --- */
        :root {
            --bg-gradient-start: #2c3e50; /* Dunkles Blau-Grau */
            --bg-gradient-end: #4ca1af;   /* Ein etwas helleres, hoffnungsvolles Blau */
            --box-color: #34495e;         /* Dunkle Schatulle */
            --box-shadow-color: #2c3e50;
            --paper-color: #fdfcf8;       /* Helles, edles Papier */
            --text-color: #2c3e50;        /* Dunkler Text */
            --accent-color: #c0392b;      /* Ein ernstes Rot für Akzente */
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            /* Ein ruhigerer, tieferer Hintergrundverlauf */
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; /* Modernere, klarere Schrift */
            overflow: hidden;
        }

        /* --- Die Schatulle (Container) --- */
        .box-container {
            position: relative;
            cursor: pointer;
            /* Kein hektisches Wackeln mehr, nur ein ganz langsames Atmen */
            animation: breathe 5s ease-in-out infinite;
            z-index: 10;
        }
        .box-container.open { animation: none; }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Der Körper der Box */
        .box-body {
            position: relative;
            width: 320px;
            height: 180px;
            background-color: var(--box-color);
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            z-index: 5;
            /* Ein kleines Schloss-Detail vorne */
            display: flex; justify-content: center; align-items: center;
        }
        .box-body::after {
            content: '';
            width: 30px; height: 30px;
            background-color: #bdc3c7; /* Silbernes Schloss */
            border-radius: 50%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Der Deckel der Box */
        .box-lid {
            position: absolute;
            top: 0; left: 0;
            width: 320px; height: 180px;
            background-color: var(--box-color);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform-origin: top; /* Dreht sich oben auf */
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20; /* Liegt ganz oben */
            border-bottom: 2px solid #bdc3c7; /* Silberne Kante */
        }

        /* --- Die Nachricht (Das Papier) --- */
        .message-card {
            position: absolute;
            top: 10px; left: 20px;
            width: 280px; height: auto;
            min-height: 220px;
            background-color: var(--paper-color);
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 4px;
            /* Startet versteckt IN der Box (zwischen Body und Lid) */
            z-index: 15;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s; /* Startet leicht verzögert */
            border: 1px solid #eee;
        }

        /* Das Entschuldigungs-GIF */
        .sorry-gif {
            width: 100px; height: auto;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .message-card h1 {
            margin: 0 0 15px 0;
            font-size: 22px;
            font-weight: 600;
            color: var(--accent-color); /* Rote Überschrift für Ernsthaftigkeit */
        }
        .message-card p {
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 15px 0;
            color: var(--text-color);
        }
        .signature {
            font-weight: bold;
            margin-top: 10px;
        }

        /* --- Animationen beim Öffnen --- */
        .box-container.open .box-lid {
            /* Klappt weit nach oben auf */
            transform: rotateX(-110deg);
        }

        .box-container.open .message-card {
            /* Fährt weit nach oben aus der Box */
            transform: translateY(-260px);
            /* Wichtig: Z-Index erhöhen, damit es über dem geöffneten Deckel liegt */
            z-index: 30;
        }

        /* --- Der Hinweis-Text --- */
        .hint {
            position: absolute;
            top: calc(50% - 180px); /* Position über der Box */
            width: 100%; text-align: center;
            color: #ecf0f1; /* Heller Text auf dunklem Grund */
            font-size: 16px; font-weight: 500;
            letter-spacing: 1px;
            animation: pulsate 3s infinite;
            pointer-events: none; z-index: 50;
        }
        @keyframes pulsate {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* --- Ruhige Hintergrund-Partikel (statt Konfetti) --- */
        .particle {
            position: absolute;
            bottom: -20px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.5); }
        }

    </style>
</head>
<body>

    <div class="box-container" id="box" onclick="openBox()">
        <div class="box-lid"></div>
        <div class="box-body"></div>

        <div class="message-card">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJ4anh5ODFqeXF1M3F4Z254aWZ5bG03d3Z5OWc5eXF3aWZ5bG03eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/OpfkuToK5gSHK/giphy.gif" alt="Sorry Bear" class="sorry-gif">

            <h1>Öznur, es tut mir leid.</h1>
            <p>Ich habe Mist gebaut und das weiß ich. Es war nicht okay von mir.<br><br>Ich hoffe, du kannst mir verzeihen.</p>
            <p class="signature">Dein Cem</p>
        </div>
    </div>

    <div class="hint" id="hint-text">Bitte öffne diese Nachricht</div>

    <script>
        let isOpen = false;

        function openBox() {
            if (isOpen) return;
            isOpen = true;

            document.getElementById('box').classList.add('open');
            document.getElementById('hint-text').style.display = 'none';

            // Starte die ruhigen Hintergrund-Partikel
            startParticles();
        }

        function startParticles() {
            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
                createParticle();
            }
        }

        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');

            // Zufällige Größe und Position
            const size = Math.random() * 30 + 10 + 'px';
            particle.style.width = size;
            particle.style.height = size;
            particle.style.left = Math.random() * 100 + 'vw';

            // Zufällige Geschwindigkeit (sehr langsam)
            const duration = Math.random() * 10 + 10 + 's'; // Zwischen 10 und 20 Sekunden
            particle.style.animationDuration = duration;
            // Zufällige Verzögerung
            particle.style.animationDelay = Math.random() * 5 + 's';

            document.body.appendChild(particle);
        }
    </script>

</body>
</html>
